name: Release

# Orchestrates the release process after a version tag is created. The
# workflow runs the common CI checks, validates the release tag, creates the
# GitHub Release, publishes the npm package, and sends the release
# notification.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pull-requests: read

jobs:
  ci:
    uses: ./.github/workflows/ci-common.yml

  release:
    name: Create GitHub Release
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/create-release.js \
            "${GITHUB_REF_NAME}"

  publish:
    name: Publish npm package
    needs: release
    runs-on: ubuntu-latest

    steps:
      # npm publishing steps here
      - run: echo "Publish npm package here"

  notify:
    name: Send release notification
    needs: publish
    runs-on: ubuntu-latest

    steps:
      # Notification steps here
      - run: echo "Send release notification here"
